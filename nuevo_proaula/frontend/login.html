<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - WiNet Control</title>
    <!-- Enlazamos nuestra hoja de estilos CSS -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Campo de contraseña con botón para ver lo que se escribe */
        .campo-con-ojo {
            position: relative;
            display: flex;
            align-items: center;
        }

        .campo-con-ojo input {
            width: 100%;
            padding-right: 46px;
        }

        .btn-ojo {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            opacity: 0.65;
            transition: opacity 0.15s ease, background 0.15s ease;
        }

        .btn-ojo:hover {
            opacity: 1;
            background: #eff6ff;
        }

        .btn-ojo:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
            opacity: 1;
        }

        .btn-ojo.activo {
            opacity: 1;
            background: #dbeafe;
        }
    </style>
</head>
<body>

    <!-- Contenedor principal que centra la tarjeta en la pantalla -->
    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Encabezado con el logo y bienvenida -->
            <div class="auth-header">
                <h1>WiNet Control</h1>
                <p>Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <!-- Caja para mostrar mensajes de error o éxito -->
            <div id="loginAlert" class="alert"></div>

            <!-- Formulario de Login -->
            <form id="loginForm" onsubmit="procesarLogin(event)">
                
                <!-- Campo: Usuario / Identificación -->
                <div class="form-group">
                    <label for="loginIdentificacion">Usuario o Identificación:</label>
                    <input 
                        type="text" 
                        id="loginIdentificacion" 
                        placeholder="Ej: superadmin, admin123 o cédula" 
                        required
                        autocomplete="username"
                    >
                </div>

                <!-- Campo: Contraseña (con botón para mostrarla) -->
                <div class="form-group">
                    <label for="loginContrasena">Contraseña:</label>
                    <div class="campo-con-ojo">
                        <input 
                            type="password" 
                            id="loginContrasena" 
                            placeholder="••••••••" 
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" id="btnVerContrasena" class="btn-ojo"
                                title="Mostrar la contraseña" aria-label="Mostrar la contraseña"
                                aria-pressed="false" onclick="alternarContrasena()">👁️</button>
                    </div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
                    Iniciar Sesión
                </button>
            </form>

            <!-- Pie de tarjeta con enlace a Registro -->
            <div class="auth-footer">
                ¿No tienes una cuenta aún? <br>
                <a href="registro.html">Regístrate aquí como nuevo cliente</a>
            </div>

                    </div>
    </div>

    <!-- Enlazamos el archivo de lógica JavaScript -->
    <script>
        // Mostrar u ocultar la contraseña mientras se escribe
        function alternarContrasena() {
            const campo = document.getElementById("loginContrasena");
            const boton = document.getElementById("btnVerContrasena");
            if (!campo || !boton) return;

            const oculta = campo.type === "password";
            campo.type = oculta ? "text" : "password";
            boton.textContent = oculta ? "🙈" : "👁️";
            boton.classList.toggle("activo", oculta);
            boton.title = oculta ? "Ocultar la contraseña" : "Mostrar la contraseña";
            boton.setAttribute("aria-label", boton.title);
            boton.setAttribute("aria-pressed", oculta ? "true" : "false");
            campo.focus();
        }
    </script>
    <script src="js/config.js?v=39"></script>
    <script src="js/errores.js?v=1"></script>
    <script src="js/app.js?v=59"></script>
</body>
</html>
